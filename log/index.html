<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The caretaker's log · og-world</title>
<script>
// The log now lives in the explorer. Old links still land in the same place:
// ?run=003#turn=…&step=4 becomes ../#003/log/turn/…/step/4.
(() => {
  const run = new URLSearchParams(location.search).get("run");
  if (!run) { location.replace("../"); return; }
  const h = new URLSearchParams(location.hash.slice(1));
  const [key] = [...h.keys()];
  const value = key ? h.get(key) : "";
  const enc = encodeURIComponent;
  let path = [enc(run), "log"];
  if (key === "turn") { path.push("turn", enc(value)); if (h.get("step")) path.push("step", enc(h.get("step"))); }
  else if (key === "entry" || key === "journal") { path.push("journal"); if (value) path.push(enc(value)); }
  else if (key === "commits") path.push("commits");
  else if (key === "files") { path.push("files"); if (value) path.push(enc(value)); }
  location.replace("../#" + path.join("/"));
})();
</script>
</head>
<body><p>The caretaker's log has moved to <a href="../">the explorer</a>.</p></body>
</html>
