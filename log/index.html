<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The caretaker's log · og-world</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1c1a; --muted: #6b6760; --rule: #e3dfd6; --panel: #f2efe8;
    --accent: #8a4b14; --you: #375a7f; --god: #7a3d8f; --warn: #a23b2a; --ok: #2f6b3a; --code: #48612b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --fg: #e9e5dc; --muted: #9a958b; --rule: #2e2b27; --panel: #1d1b19;
            --accent: #e0a15e; --you: #8fb4dc; --god: #c99be0; --warn: #e48a78; --ok: #8fc79a; --code: #b8d38a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; }
  a { color: var(--accent); }
  .crumbs { color: var(--muted); margin: 0 0 4px; font-size: .95rem; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; font-weight: normal; }
  h2 { font-size: 1.15rem; font-weight: normal; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  nav.tabs { display: flex; flex-wrap: wrap; gap: 4px 18px; border-bottom: 1px solid var(--rule); margin: 0 0 16px; }
  nav.tabs a { text-decoration: none; padding: 6px 0; color: var(--muted); border-bottom: 2px solid transparent; }
  nav.tabs a.on { color: var(--fg); border-bottom-color: var(--accent); }
  .mono, pre, code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-size: 13px; line-height: 1.5; }
  code { font-size: .88em; color: var(--code); }

  .row { display: block; text-decoration: none; color: var(--fg); padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .row .top { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: .95rem; }
  .row .when { color: var(--accent); }
  .row .meta { color: var(--muted); font-size: .85rem; }
  .row .meta.right { margin-left: auto; }
  .row .said { color: var(--muted); font-size: .95rem; margin-top: 2px; overflow-wrap: anywhere; }
  .kind { font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); }
  .kind.deliberate { border-color: var(--accent); color: var(--accent); }
  .filters { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); margin: 0 0 8px; }
  .filters label { cursor: pointer; }

  .pager { display: flex; justify-content: space-between; gap: 12px; margin: 0 0 14px; font-size: .95rem; }
  details { border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); margin: 0 0 10px; }
  details > summary { cursor: pointer; padding: 8px 12px; color: var(--muted); }
  details > .body { padding: 0 12px 12px; }
  details.woke pre { max-height: 420px; overflow-y: auto; }
  .said-block { margin: 14px 0; }
  .said-block p { margin: 0 0 10px; }
  .thinking { border-left: 3px solid var(--rule); padding: 2px 12px; color: var(--muted); font-style: italic; margin: 12px 0; }
  .step { margin: 6px 0; }
  .step > summary, .step > .line { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; padding: 6px 10px; }
  .step > .line { border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); }
  .step .n { color: var(--muted); }
  .step .tool { color: var(--fg); font-weight: 600; }
  .step .args { color: var(--muted); overflow-wrap: anywhere; }
  .step .res { color: var(--muted); padding: 2px 10px 6px 28px; font-size: 12.5px; }
  .step.err .res { color: var(--warn); }
  .step.target { outline: 2px solid var(--accent); border-radius: 6px; }
  .label { font-size: .8rem; color: var(--muted); margin: 10px 0 4px; font-family: Georgia, serif; }
  .content.code { white-space: pre; overflow-wrap: normal; }
  .content { max-height: 520px; overflow: auto; background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px; }
  .tool-speak .tool, .tool-adjust .tool { color: var(--god); }
  .tool-play .tool { color: var(--you); }
  .tool-deploy .tool, .tool-commit .tool { color: var(--ok); }

  .prose { line-height: 1.6; }
  .prose h1, .prose h2, .prose h3 { font-weight: normal; margin: 22px 0 8px; }
  .prose h1 { font-size: 1.3rem; } .prose h2 { font-size: 1.15rem; } .prose h3 { font-size: 1.05rem; }
  .prose blockquote { margin: 10px 0; padding-left: 14px; border-left: 3px solid var(--rule); color: var(--muted); }
  .prose hr { border: 0; border-top: 1px solid var(--rule); margin: 20px 0; }
  .prose ul { padding-left: 22px; }
  .commit { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .commit .msg { font-weight: 600; }
  .commit .why { color: var(--muted); margin-top: 4px; white-space: pre-wrap; font-size: .95rem; }
  .commit .meta { font-size: .85rem; color: var(--muted); margin-top: 4px; }
  .hidden { display: none; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<main>
  <p class="crumbs"><a href="../">og-world</a> · <a href="../runs/">the runs</a></p>
  <h1 id="title">The caretaker's log</h1>
  <p class="sub" id="sub"></p>
  <nav class="tabs hidden" id="tabs">
    <a href="#turns" data-tab="turns">Turns</a>
    <a href="#journal" data-tab="journal">Journal</a>
    <a href="#commits" data-tab="commits">Commits</a>
    <a href="#files" data-tab="files">Files</a>
  </nav>
  <div id="view"></div>
</main>

<script type="module">
const $ = id => document.getElementById(id);
const run = new URLSearchParams(location.search).get("run");
const view = $("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const json = path => fetch(path).then(r => { if (!r.ok) throw new Error(`${path}: ${r.status}`); return r.json(); });
const text = path => fetch(path).then(r => { if (!r.ok) throw new Error(`${path}: ${r.status}`); return r.text(); });

// Times are the run's own, in UTC, as its files are named.
function when(stamp) {
  const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d)(\d\d)(\d\d)Z$/.exec(stamp);
  if (!m) return stamp;
  const d = new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]));
  return d.toLocaleString("en-GB", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + " UTC";
}
const kindName = k => k === "deliberate" ? "long turn" : k === "reflex" ? "short turn" : k;

// Just enough Markdown for journal entries and the caretaker's own files.
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>');
}
function markdown(src) {
  const out = []; let para = [], list = null, quote = [];
  const flush = () => {
    if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; }
    if (list) { out.push(`<ul>${list.map(i => `<li>${inline(i)}</li>`).join("")}</ul>`); list = null; }
    if (quote.length) { out.push(`<blockquote>${markdown(quote.join("\n"))}</blockquote>`); quote = []; }
  };
  let fence = null;
  for (const line of src.split("\n")) {
    if (fence !== null) { if (/^```/.test(line)) { out.push(`<pre>${esc(fence.join("\n"))}</pre>`); fence = null; } else fence.push(line); continue; }
    if (/^```/.test(line)) { flush(); fence = []; continue; }
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    if (h) { flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(line)) { flush(); out.push("<hr>"); continue; }
    if (/^>\s?/.test(line)) { if (para.length || list) { const q = quote; quote = []; flush(); quote = q; } quote.push(line.replace(/^>\s?/, "")); continue; }
    const li = /^\s*[-*]\s+(.*)$/.exec(line) || /^\s*\d+\.\s+(.*)$/.exec(line);
    if (li) { if (para.length || quote.length) flush(); (list ??= []).push(li[1]); continue; }
    if (!line.trim()) { flush(); continue; }
    if (list && /^\s+/.test(line)) { list[list.length - 1] += " " + line.trim(); continue; }
    if (quote.length) flush();
    para.push(line.trim());
  }
  if (fence) out.push(`<pre>${esc(fence.join("\n"))}</pre>`);
  flush();
  return out.join("\n");
}

function route() {
  const h = new URLSearchParams(location.hash.slice(1).replace(/^(\w+)=/, "$1=").replace(/&/g, "&"));
  const keys = [...h.keys()];
  return { tab: keys[0] || "turns", value: h.get(keys[0]) || "", step: h.get("step") };
}

if (!run) {
  $("title").textContent = "The caretaker's log";
  const runs = await json("runs.json");
  $("sub").textContent = "Every turn each caretaker took, what it woke to, what it did, and what it wrote down.";
  view.innerHTML = runs.map(r => `<a class="row" href="?run=${encodeURIComponent(r.run)}"><div class="top"><span class="when">${esc(r.title)}</span><span class="meta right">${r.turns} turn${r.turns === 1 ? "" : "s"} · ${r.journal} journal ${r.journal === 1 ? "entry" : "entries"}</span></div></a>`).join("");
} else if (!/^[a-z0-9-]+$/.test(run)) {
  view.innerHTML = `<p class="empty">No such run.</p>`;
} else {
  const index = await json(`${run}/index.json`);
  $("title").textContent = index.title;
  document.title = `${index.title} · the caretaker's log`;
  const longs = index.turns.filter(t => t.kind === "deliberate").length;
  $("sub").innerHTML = `${esc(index.model)} · ${index.turns.length} turns (${longs} long, ${index.turns.length - longs} short) · ${index.journal.length} journal ${index.journal.length === 1 ? "entry" : "entries"}`
    + (index.playable ? ` · <a href="../play/?run=${encodeURIComponent(run)}">play this world</a>` : "");
  $("tabs").classList.remove("hidden");
  const journalByTurn = Object.fromEntries(index.journal.filter(j => j.turn).map(j => [j.turn, j.name]));
  const commitsByTurn = {};
  for (const c of index.commits) (commitsByTurn[c.turn] ??= []).push(c);

  const show = async () => {
    const r = route();
    const tab = r.tab === "turn" ? "turns" : r.tab === "entry" ? "journal" : r.tab;
    for (const a of document.querySelectorAll("nav.tabs a")) a.classList.toggle("on", a.dataset.tab === tab);
    try {
      if (r.tab === "turn") await showTurn(r.value, r.step);
      else if (r.tab === "journal" || r.tab === "entry") await showJournal(r.value);
      else if (r.tab === "commits") showCommits();
      else if (r.tab === "files") await showFiles(r.value);
      else showTurns();
    } catch (e) { view.innerHTML = `<p class="empty">Could not load that: ${esc(e.message)}</p>`; }
  };
  addEventListener("hashchange", show);
  show();

  function showTurns() {
    const only = sessionStorage.getItem("og-log-filter") || "all";
    const rows = index.turns.map(t => {
      if (only !== "all" && t.kind !== only) return "";
      const facts = [t.elapsed ? `${Math.round(t.elapsed)}s` : null, t.steps ? `${t.steps} steps` : null,
                     t.events ? `${t.events} things happened first` : null, !t.finished ? "unfinished" : null].filter(Boolean).join(" · ");
      return `<a class="row" href="#turn=${encodeURIComponent(t.name)}">
        <div class="top"><span class="when">${esc(when(t.when))}</span><span class="kind ${esc(t.kind)}">${esc(kindName(t.kind))}</span>
        ${journalByTurn[t.name] ? `<span class="meta">wrote a journal entry</span>` : ""}
        <span class="meta right">${esc(facts)}</span></div>
        ${t.said ? `<div class="said">${esc(t.said.length > 220 ? t.said.slice(0, 220) + "…" : t.said)}</div>` : ""}</a>`;
    }).join("");
    view.innerHTML = `<div class="filters">
        ${["all", "deliberate", "reflex"].map(k => `<label><input type="radio" name="f" value="${k}" ${only === k ? "checked" : ""}> ${k === "all" ? "all turns" : kindName(k) + "s"}</label>`).join("")}
      </div>${rows || `<p class="empty">No turns were recorded for this run.</p>`}`;
    for (const input of view.querySelectorAll("input[name=f]"))
      input.onchange = () => { try { sessionStorage.setItem("og-log-filter", input.value); } catch {} showTurns(); };
  }

  async function showTurn(name, step) {
    const at = index.turns.findIndex(t => t.name === name);
    if (at < 0) throw new Error("no such turn");
    const t = await json(`${run}/turns/${encodeURIComponent(name)}.json`);
    const meta = index.turns[at];
    const prev = index.turns[at - 1], next = index.turns[at + 1];
    const parts = [];
    parts.push(`<div class="pager"><span>${prev ? `<a href="#turn=${encodeURIComponent(prev.name)}">← earlier</a>` : ""}</span>
      <a href="#turns">all turns</a><span>${next ? `<a href="#turn=${encodeURIComponent(next.name)}">later →</a>` : ""}</span></div>`);
    parts.push(`<h2>${esc(when(t.when))} · ${esc(kindName(t.kind))}</h2>
      <p class="sub">${[meta.elapsed ? `${Math.round(meta.elapsed)} seconds` : null, meta.steps ? `${meta.steps} steps` : null, !meta.finished ? "never finished" : null].filter(Boolean).join(" · ")}
      ${journalByTurn[name] ? ` · <a href="#entry=${encodeURIComponent(journalByTurn[name])}">its journal entry</a>` : ""}</p>`);

    const w = t.woke;
    if (w && w.lines.length) {
      parts.push(`<details class="woke"><summary>What had happened since it last looked: ${w.lines.length + w.more} things, events ${w.from + 1}–${w.to}</summary>
        <div class="body"><pre>${esc(w.lines.join("\n"))}${w.more ? `\n… and ${w.more} more` : ""}</pre></div></details>`);
    } else if (w && w.to != null) {
      parts.push(`<p class="sub">Nothing had happened in the world since it last looked.</p>`);
    }

    for (const item of t.items) {
      if (item.t === "text") parts.push(`<div class="said-block prose">${markdown(item.text)}</div>`);
      else if (item.t === "thinking") parts.push(`<div class="thinking prose">${markdown(item.text)}</div>`);
      else parts.push(stepHtml(item));
    }
    view.innerHTML = parts.join("\n");
    if (step) {
      const el = document.getElementById(`step-${step}`);
      if (el) { el.classList.add("target"); if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView({ block: "center" }); }
    } else scrollTo(0, 0);
  }

  function stepHtml(s) {
    const head = `<span class="n">${s.n}.</span> <span class="tool">${esc(s.tool)}</span> <span class="args">${esc(s.args)}</span>`;
    const res = s.result != null ? `<pre class="res">${esc(s.result)}</pre>` : "";
    const extra = [];
    const input = s.input;
    if (input && s.tool === "write_file") {
      extra.push(`<div class="label">What it wrote to ${esc(input.path)}</div><pre class="content code">${esc(input.content)}</pre>`);
    } else if (input && s.tool === "replace_in_file") {
      const find = input.find ?? input.old, put = input.put ?? input.replace ?? input.new;
      extra.push(`<div class="label">In ${esc(input.path)}, it replaced</div><pre class="content code">${esc(find)}</pre>
                  <div class="label">with</div><pre class="content code">${esc(put)}</pre>`);
    } else if (input && s.tool === "commit") {
      extra.push(`<div class="label">Commit message</div><pre class="content">${esc(input.message)}</pre>`
        + (input.rationale ? `<div class="label">Why, in its words</div><pre class="content">${esc(input.rationale)}</pre>` : ""));
    } else if (input && s.tool === "play" && Array.isArray(input.commands)) {
      extra.push(`<div class="label">What it typed${input.name ? `, as ${esc(input.name)}` : ""}</div><pre class="content">${esc(input.commands.join("\n"))}</pre>`);
    } else if (input && (s.tool === "speak" || s.tool === "adjust")) {
      extra.push(`<div class="label">In full</div><pre class="content">${esc(input.text ?? JSON.stringify(input, null, 2))}</pre>`
        + (input.text ? `<div class="label">Arguments</div><pre class="content">${esc(JSON.stringify(Object.fromEntries(Object.entries(input).filter(([k]) => k !== "text")), null, 2))}</pre>` : ""));
    } else if (input) {
      extra.push(`<div class="label">Arguments in full</div><pre class="content">${esc(JSON.stringify(input, null, 2))}</pre>`);
    }
    if (s.full) extra.push(`<div class="label">What came back</div><pre class="content">${esc(prettify(s.full))}</pre>`);
    const cls = `step tool-${esc(s.tool)}${s.error ? " err" : ""}`;
    if (!extra.length) return `<div class="${cls}" id="step-${s.n}"><div class="line">${head}</div>${res}</div>`;
    return `<details class="${cls}" id="step-${s.n}"><summary>${head}</summary><div class="body">${extra.join("")}</div></details>${res}`;
  }
  function prettify(body) {
    try { const v = JSON.parse(body); return typeof v === "string" ? v : JSON.stringify(v, null, 2); } catch { return body; }
  }

  async function showJournal(name) {
    if (!index.journal.length) { view.innerHTML = `<p class="empty">This run kept no journal.</p>`; return; }
    const entries = [...index.journal].reverse();
    const chosen = entries.find(e => e.name === name) || entries[0];
    const body = await text(`${run}/journal/${encodeURIComponent(chosen.name)}.md`);
    const i = entries.indexOf(chosen);
    const newer = entries[i - 1], older = entries[i + 1];
    view.innerHTML = `<div class="pager"><span>${older ? `<a href="#entry=${encodeURIComponent(older.name)}">← earlier</a>` : ""}</span>
        <span>${chosen.turn ? `<a href="#turn=${encodeURIComponent(chosen.turn)}">the turn that wrote it</a>` : ""}</span>
        <span>${newer ? `<a href="#entry=${encodeURIComponent(newer.name)}">later →</a>` : ""}</span></div>
      <h2>${esc(when(chosen.name))}</h2>
      <div class="prose">${markdown(body)}</div>
      <details><summary>All ${entries.length} entries</summary><div class="body">${entries.map(e =>
        `<a class="row" href="#entry=${encodeURIComponent(e.name)}"><span class="when">${esc(when(e.name))}</span></a>`).join("")}</div></details>`;
    scrollTo(0, 0);
  }

  function showCommits() {
    if (!index.commits.length) { view.innerHTML = `<p class="empty">No commits were recorded for this run.</p>`; return; }
    view.innerHTML = `<p class="sub">Every change it committed to the world, with its reasons, newest last.</p>` + index.commits.map(c => {
      const t = index.turns.find(x => x.name === c.turn);
      return `<div class="commit"><div class="msg">${esc(c.message)}</div>
        ${c.rationale ? `<div class="why">${esc(c.rationale)}</div>` : ""}
        <div class="meta"><a href="#turn=${encodeURIComponent(c.turn)}&step=${c.step}">${esc(when(t?.when ?? c.turn))}, ${esc(kindName(t?.kind ?? ""))}, step ${c.step}</a></div></div>`;
    }).join("");
  }

  async function showFiles(name) {
    const files = [...index.files];
    if (index.playable) files.push({ file: "world", label: "The world as it ended: the map file the live server was reading" });
    if (!name) {
      view.innerHTML = files.map(f => `<a class="row" href="#files=${encodeURIComponent(f.file)}"><div class="top"><span class="when">${esc(f.file === "world" ? "world.json" : f.file)}</span></div><div class="said">${esc(f.label)}</div></a>`).join("")
        || `<p class="empty">Nothing kept for this run.</p>`;
      return;
    }
    if (name === "world") {
      const world = await text(`../play/${run}/world.json`);
      view.innerHTML = `<p><a href="#files">← files</a></p><h2>world.json</h2><p class="sub">${files.at(-1).label}. <a href="../play/${encodeURIComponent(run)}/world.json">Download</a>.</p><pre class="content" style="max-height:none">${esc(JSON.stringify(JSON.parse(world), null, 2))}</pre>`;
      return;
    }
    const f = index.files.find(x => x.file === name);
    if (!f) throw new Error("no such file");
    const body = await text(`${run}/files/${encodeURIComponent(f.file)}`);
    view.innerHTML = `<p><a href="#files">← files</a></p><h2>${esc(f.file)}</h2><p class="sub">${esc(f.label)}</p><div class="prose">${markdown(body)}</div>`;
    scrollTo(0, 0);
  }
}
</script>
</body>
</html>
